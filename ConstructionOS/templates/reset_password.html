{% extends "base.html" %}

{% block content %}
<main class="login-page">
    <section class="login-card" aria-labelledby="new-password-heading">
        <img class="login-logo" src="{{ url_for('static', filename='images/constructionos-logo.svg') }}" alt="AR logo">
        <p class="login-brand">CONSTRUCTIONOS</p>
        <div class="login-divider" aria-hidden="true"><span></span></div>

        <h1 id="new-password-heading">Choose a new password</h1>
        <p class="login-subtitle">Use at least 8 characters for your new password.</p>

        <form method="POST" class="login-form">
            <div class="login-field">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="login-field">
                <label for="confirm-password">Confirm new password</label>
                <input type="password" id="confirm-password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="btn login-submit w-100">Change password</button>
        </form>
    </section>
</main>
{% endblock %}
