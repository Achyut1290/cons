{% extends "base.html" %}

{% block content %}
<main class="login-page">
    <section class="login-card" aria-labelledby="login-heading">
        <img class="login-logo" src="{{ url_for('static', filename='images/constructionos-logo.svg') }}" alt="AR logo">
        <p class="login-brand">CONSTRUCTIONOS</p>
        <div class="login-divider" aria-hidden="true"><span></span></div>

        <h1 id="login-heading">Welcome back</h1>
        <p class="login-subtitle">Sign in to continue to your workspace.</p>

        <form method="POST" class="login-form">
            <div class="login-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-control" autocomplete="email" placeholder="you@company.com" required>
            </div>
            <div class="login-field">
                <div class="login-label-row">
                    <label for="password">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn login-submit w-100">Sign in</button>
        </form>

        <p class="register-prompt">Don't have an account? <a href="/register">Create one</a></p>
    </section>
</main>
{% endblock %}
