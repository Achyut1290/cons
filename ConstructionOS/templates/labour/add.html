{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Add Labour</h2>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Project</label>
        <select name="project_id" class="form-select" required>
            {% for project in projects %}
            <option value="{{ project.id }}">{{ project.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Worker Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Worker Type</label>
            <input type="text" name="worker_type" class="form-control">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control">
        </div>
        <div class="col-md-6">
            <label class="form-label">Daily Wage</label>
            <input type="number" step="0.01" name="daily_wage" class="form-control">
        </div>
    </div>

    <div class="mb-3 mt-3">
        <label class="form-label">Working Days</label>
        <input type="number" name="working_days" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Save Labour</button>
    <a href="/labour/" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
