{% extends "base.html" %}

{% block content %}
<main class="login-page">
    <section class="login-card" aria-labelledby="reset-request-heading">
        <img class="login-logo" src="{{ url_for('static', filename='images/constructionos-logo.svg') }}" alt="AR logo">
        <p class="login-brand">CONSTRUCTIONOS</p>
        <div class="login-divider" aria-hidden="true"><span></span></div>

        <h1 id="reset-request-heading">Forgot password?</h1>
        <p class="login-subtitle">Enter your account email and we'll send reset instructions.</p>

        <form method="POST" class="login-form">
            <div class="login-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" class="form-control" autocomplete="email" placeholder="you@company.com" required>
            </div>
            <button type="submit" class="btn login-submit w-100">Send reset link</button>
        </form>

        <p class="register-prompt"><a href="{{ url_for('auth.login') }}">Return to sign in</a></p>
    </section>
</main>
{% endblock %}
