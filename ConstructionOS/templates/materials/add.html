{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Add Material</h2>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Project</label>
        <select name="project_id" class="form-select" required>
            {% for project in projects %}
            <option value="{{ project.id }}">{{ project.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Material Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control">
        </div>
        <div class="col-md-6">
            <label class="form-label">Unit</label>
            <input type="text" name="unit" class="form-control">
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-md-4">
            <label class="form-label">Quantity</label>
            <input type="number" step="0.01" name="quantity" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label">Minimum Stock</label>
            <input type="number" step="0.01" name="minimum_stock" class="form-control">
        </div>
        <div class="col-md-4">
            <label class="form-label">Cost</label>
            <input type="number" step="0.01" name="cost" class="form-control">
        </div>
    </div>

    <button type="submit" class="btn btn-success mt-4">Save Material</button>
    <a href="/materials/" class="btn btn-secondary mt-4">Cancel</a>
</form>
{% endblock %}
