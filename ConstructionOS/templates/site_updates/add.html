{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Add Site Update</h2>

<form method="POST">
    <div class="mb-3">
        <label class="form-label">Project</label>
        <select name="project_id" class="form-select" required>
            {% for project in projects %}
            <option value="{{ project.id }}">{{ project.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label">Update Date</label>
            <input type="date" name="update_date" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Progress (%)</label>
            <input type="number" step="0.01" name="progress" class="form-control">
        </div>
    </div>

    <div class="mb-3 mt-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Issues</label>
        <textarea name="issues" class="form-control"></textarea>
    </div>

    <button type="submit" class="btn btn-success">Save Update</button>
    <a href="/site-updates/" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
